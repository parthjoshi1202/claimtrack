name: Nightly destroy

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC (11:00 PM EST / 12:00 AM EDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy dev stack
    runs-on: ubuntu-latest
    environment: aws-deploy
    defaults:
      run:
        working-directory: infra/envs/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false

      - name: Write destroy summary
        run: |
          {
            echo "### ClaimTrack Stack Destroyed"
            echo ""
            echo "- **Trigger:** \`${{ github.event_name }}\`"
            echo "- **Target:** \`infra/envs/dev\`"
            echo "- **Status:** All ephemeral AWS resources destroyed."
          } >> "$GITHUB_STEP_SUMMARY"